name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + pytest (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
          enable-cache: true
      - name: Install (CPU torch from uv.lock)
        run: uv sync --frozen --extra space
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (tiny committed fixtures, no datasets or weights)
        run: uv run pytest
      - name: README results match results/
        run: uv run python scripts/update_readme_results.py --check

  extension:
    name: extension unit tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node test runner
        working-directory: extension
        run: node --test "tests/*.test.mjs"
