<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepTrace settings</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <h1>DeepTrace settings</h1>
    <form id="form" novalidate>
      <label for="apiUrl">API URL</label>
      <input id="apiUrl" type="url" placeholder="http://127.0.0.1:8000" required>
      <p class="note">Start the API with <code>uv run python -m deeptrace serve</code> in the
        deeptrace folder. Images are only sent when you click <em>Scan this page</em>.</p>
      <p class="warn" id="remoteWarn" hidden>This is not your own computer: scanned images will
        be uploaded to that server.</p>

      <label class="check"><input id="showConfidence" type="checkbox">
        Show the probability on badges</label>

      <div class="row">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="test">Test connection</button>
        <button type="button" id="reset">Reset to defaults</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
  </main>
  <script src="lib/labels.js"></script>
  <script src="options.js"></script>
</body>
</html>
