# Ablation data: FF++ full frames (no face crop). Same filtering and splits as face crops.
# These datasets need access requests and must never be redistributed.
raw_root: data/raw
output_dir: data/crops/ffpp_fullframe
datasets:
  - name: ffpp
    type: ffpp
    root: FaceForensics++
    options:
      compression: c23
      methods: [Deepfakes, Face2Face, FaceSwap, NeuralTextures]
      # Official FF++ split JSONs (train.json/val.json/test.json). If omitted,
      # videos are split by connected identity groups with split_fractions.
      splits_dir: null
frames_per_video: 15
crop:
  margin: 1.3
  size: 224
  jpeg_quality: 95
  min_confidence: 0.90
  min_face_px: 64
  mode: full_frame              # ablation: whole frame, still only frames with a valid face
split_fractions: [0.72, 0.14, 0.14]   # FF++ official proportions (720/140/140)
seed: 42
near_dup_distance: 4
device: auto
threads: 2
