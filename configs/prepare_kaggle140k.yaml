# Face crops from Kaggle "140k Real and Fake Faces" (xhlulu): FFHQ reals vs StyleGAN fakes.
# Download it and unzip under data/raw/140k-real-and-fake-faces/ (any layout with
# real/ and fake/ folders works). The dataset's own train/valid/test folders are
# ignored: images are re-split with perceptual-hash deduplication.
raw_root: data/raw
output_dir: data/crops/kaggle140k
datasets:
  - name: kaggle140k
    type: image_folder
    root: 140k-real-and-fake-faces
    max_per_class: 20000          # 40k images is plenty for B0; set null for all 140k
    options:
      fake_method: stylegan
frames_per_video: 15
crop:
  margin: 1.3
  size: 224
  jpeg_quality: 95
  min_confidence: 0.90
  min_face_px: 64
  mode: face                      # "full_frame" for the no-face-cropping ablation
split_fractions: [0.8, 0.1, 0.1]
seed: 42
near_dup_distance: 4
device: auto                      # cuda on Kaggle, cpu locally
threads: 2
