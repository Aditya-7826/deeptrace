[project]
name = "deeptrace"
version = "0.1.0"
description = "Deepfake face detector with Grad-CAM explanations, a CPU API and a Chrome extension"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "facenet-pytorch>=2.6",
    "albumentations>=1.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "grad-cam>=1.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
space = ["gradio>=4.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
deeptrace = "deeptrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptrace"]

[tool.uv]
# facenet-pytorch 2.6 pins torch<2.3, numpy<2 and Pillow<10.3. MTCNN only needs
# torch/torchvision/numpy/PIL, so the pins are relaxed (approved deviation).
override-dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pillow>=10.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower tests (MTCNN on fixtures)"]
